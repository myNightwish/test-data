name: Daily US Stock Report

on:
  schedule:
    # 对应北京时间 09:00, 21:20, 22:20 (换算为 UTC 时间)
    - cron: '0 1 * * *'
    - cron: '20 13 * * *'
    - cron: '20 14 * * *'

  # 支持在 GitHub 界面手动触发，并可勾选是否开启 US_FORCE=1
  workflow_dispatch:
    inputs:
      force_run:
        description: '是否跳过美东时间判断强制运行 (US_FORCE=1)'
        required: false
        type: boolean
        default: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bash Entrypoint
        env:
          # 如果在网页上勾选了强制运行，设置 US_FORCE=1
          US_FORCE: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
        run: |
          chmod +x ./your_script_name.sh
          ./your_script_name.sh

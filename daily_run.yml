name: Daily Python Script Runner

# 触发条件
on:
  schedule:
    # 定时任务：每天运行一次 (Cron 表达式)
    # 注意：GitHub Actions 使用的是 UTC 时间！
    # 下面设定的是 UTC 时间的 06:00（如果你在北京时间，相当于上午 14:00）
    - cron: '0 6 * * *'
  
  # 允许你随时在 GitHub 网页上点击按钮手动运行（方便测试代码）
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟环境

    steps:
      # 1. 拉取你的仓库代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 填写你需要使用的 Python 版本

      # 3. 安装依赖 (如果你的仓库里有 requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 赋予 .sh 脚本执行权限，并运行它
      - name: Make script executable and run
        run: |
          chmod +x ./run_task.sh
          ./run_task.sh
